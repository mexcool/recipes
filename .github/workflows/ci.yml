name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec vite build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the sync service on local D1
        run: |
          pnpm worker:migrate:local
          (pnpm worker:dev > wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:8787/ && break; sleep 1; done
          curl -sf http://localhost:8787/
      - run: pnpm test:e2e
        env: { SYNC_URL: 'http://localhost:8787' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
